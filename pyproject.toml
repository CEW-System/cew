[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cew"
version = "0.1.0"
description = "Cognitive Electronic Warfare Testbed"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "torch>=2.1.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "pytest>=7.4.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "streamlit>=1.28.0",
    "plotly>=5.18.0",
    "h5py>=3.10.0",
    "pyzmq>=25.0.0",
    "tensorboard>=2.14.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]